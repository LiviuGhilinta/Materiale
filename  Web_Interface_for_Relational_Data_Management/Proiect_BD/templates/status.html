<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Status Operațiune</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body class="bg-info d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row">
            <div class="col-md-8 mx-auto text-center bg-white p-5 shadow rounded">
                
                {% if "Eroare" in titlu or "Atentie" in titlu or "Atenție" in titlu %}
                    <i class="fa fa-window-close text-danger display-1 mb-4" aria-hidden="true"></i>
                {% else %}
                    <i class="fa fa-check-circle text-success display-1 mb-4"></i>
                {% endif %}

                <h1 class="mb-4">{{ titlu }}</h1>
                <p class="lead mb-5">{{ mesaj }}</p>
                
                <a href="{{ url_for('acces') }}" class="btn btn-primary btn-lg px-5">
                    <i class="fa fa-home"></i> <span>Home</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
