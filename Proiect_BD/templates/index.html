<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PAGE settings -->
  <title>
    {%if cont_creat%}
      Cont creat cu succes!
    {%else%}
      Pagina principala
    {%endif%}  
    </title>
  <!-- CSS dependencies -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" type="text/css">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>

<body class="bg-info">
  <div class="h-50 d-flex align-items-center bg-info" style>
    <div class="container">
      <div class="row">
        <div class="mx-auto text-center col-md-6">
          <h1 class="display-1 text-white">Welcome!</h1>
          <p class="lead text-primary" style>Pentru a avea acces trebuie sa va logati!<br>Daca nu aveti cont, va puteti creea unul prin apasarea butonului create account!&nbsp;&nbsp;</p>
          {% if eroare %}
            <p style="color: #ff0000; font-weight: bold;">
                Utilizator sau parola gresita!
            </p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
  <div class="py-5" style >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 text-center">
          <form id="c_form-h" action="/dupa_acces" method="POST">
            
            <div class="form-group row"> 
              <label for="inputmailh" class="col-2 col-form-label">User</label>
              <div class="col-10">
                <input type="text" name="username" class="form-control w-75" id="inputmailh" placeholder="RaduIonut"> 
              </div>
            </div>

            <div class="form-group row"> 
              <label for="inputpasswordh" class="col-2 col-form-label">Password</label>
              <div class="col-10">
                <input type="password" name="password" class="form-control w-75" id="inputpasswordh" placeholder="Password"> 
              </div>
            </div>

            <button type="submit" class="btn btn-primary text-left m-1">Submit</button>
            </form>

          <a href="/create_user" class="btn btn-primary m-2">Create Account</a>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12"></div>
      </div>
    </div>
  </div>
  <div class="py-5">
    <div class="container">
      <div class="row">
        <div class="col-md-12"></div>
      </div>
    </div>
  </div>
</body>

</html>
