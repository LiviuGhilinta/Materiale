<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Modifică Clasa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body class="bg-info">
    <div class="container bg-white p-4 shadow rounded mt-5">
        <h1 class="text-center"><i class="fa fa-edit"></i> Modifică Clasa</h1>
        <form action="/m2_clasa" method="post">
            <table class="table">
                <tr>
                    <td>IdClasa</td>
                    <td><input type="text" name="idclasa" value="{{ id_aux }}" readonly class="form-control"></td>
                </tr>
                <tr>
                    <td>Profesor:</td>
                    <td>
                        <select name="idprofesor" class="form-control">
                            {% for p in profesori %}
                                <option value="{{ p[0] }}" {% if p[0] == clasa[1] %}selected{% endif %}>
                                    {{ p[1] }} {{ p[2] }} ({{ p[3] }})
                                </option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Curs:</td>
                    <td>
                        <select name="idcurs" class="form-control">
                            {% for c in curs %}
                                <option value="{{ c[0] }}" {% if c[0] == clasa[2] %}selected{% endif %}>
                                    {{ c[1] }}
                                </option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Data Curs:</td>
                    <td><input type="text" name="DataCurs" value="{{ clasa[8] }}" class="form-control"></td>
                </tr>
                <tr>
                    <td>Clasa:</td>
                    <td><input type="text" name="Clasa" value="{{ clasa[9] }}" class="form-control"></td>
                </tr>
                <tr>
                    <td>Număr Elevi:</td>
                    <td><input type="text" name="NumarElevi" value="{{ clasa[10] }}" class="form-control"></td>
                </tr>
            </table>
            <div class="text-center">
                <button type="submit" class="btn btn-warning">
                    <i class="fa fa-save"></i> Salvează Modificările
                </button>
                <a href="/dupa_acces" class="btn btn-primary">
                    <i class="fa fa-home"></i> Home
                </a>
            </div>
        </form>
    </div>
</body>
</html>
