<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" type="text/css">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>

<body class="bg-info">
  <div class="py-5" >
    <div class="container">
      <div class="row">
        <div class="col-md-12">
          <p class="lead text-primary text-center">Introduceti user-ul si parola!<br>Hint: Introduceti o parola pe care sa o retineti cu usurinta!</p>
        </div>
      </div>
    </div>
  </div>
  <div class="py-5" style>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 text-center">
          <form action="/create_user" method="post">
            <div class="form-group row"> <label for="inputmailh" class="col-2 col-form-label">User</label>
              <div class="col-10">
                <input type="text" name="username" class="form-control w-75" id="inputuserh" placeholder="andrei" required> </div>
            </div>
            <div class="form-group row"> <label for="inputpasswordh" class="col-2 col-form-label">Password</label>
              <div class="col-10">
                <input type="password" name="password" class="form-control w-75" id="inputpasswordh" placeholder="Password" required> </div>
            </div>
            <button type="submit" class="btn btn-primary text-left m-1">Submit</button>
        </form>
        </div>
      </div>
      <div class="row">
        <div class="col-md-12"></div>
      </div>
    </div>
  </div>
  <div class="py-5">
    <div class="container">
      <div class="row">
        <div class="col-md-12"></div>
      </div>
    </div>
  </div>

</html>
