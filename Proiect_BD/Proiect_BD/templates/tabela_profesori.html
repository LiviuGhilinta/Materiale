<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tabela Profesori</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" type="text/css">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
    <h1 align="center">Tabela Profesori:</h1>
    <br />
    <p align="center">
        <a href="/nou_profesor" class="btn btn-primary btn-lg px-5">
    <i class="fa fa-user" aria-hidden="true"></i> <span>Adauga Profesor</span></a> 
    </p>

    <form action="/sterge_profesor" method="post">
        <table border="2" align="center">
            <tr>
                <td><b>Mark:</b></td>
                <td><b>IdProfesor:</b></td>
                <td><b>Nume:</b></td>
                <td><b>Prenume:</b></td>
                <td><b>Disciplina:</b></td>
            </tr>
            
            {% for prof in profesori %}
            <tr>
                <td><input type="checkbox" name="primarykey" value="{{ prof[0] }}" /></td>
                <td>{{ prof[0] }}</td>
                <td>{{ prof[1] }}</td>
                <td>{{ prof[2] }}</td>
                <td>{{ prof[3] }}</td>
            </tr>
            {% endfor %}
            
        </table>
        <br />
        <p align="center">
            <button type="submit" class="btn btn-danger btn-lg px-5">
        	<i class="fa fa-trash"></i> Sterge liniile marcate
    		</button>
        </p>
    </form>

    <br />
    <p align="center">
        <a href="/dupa_acces" class="btn btn-primary btn-lg px-5">
    <i class="fa fa-home"></i> <span>Home</span>
</a></a>
    </p>
</body>
</html>
